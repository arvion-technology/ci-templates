name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node major versions to test.
        type: string
        required: false
        default: '["20", "22"]'
      working-directory:
        description: Directory that contains package.json.
        type: string
        required: false
        default: "."
      package-manager:
        description: Package manager command used for install and test.
        type: string
        required: false
        default: "npm"
      coverage-threshold:
        description: Fail when line coverage is below this percentage. 0 disables the gate.
        type: number
        required: false
        default: 0

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: ${{ inputs.package-manager }} ci

      - name: Unit tests
        run: ${{ inputs.package-manager }} test

      - name: Coverage gate
        if: ${{ inputs.coverage-threshold > 0 }}
        run: npx c8 check-coverage --lines ${{ inputs.coverage-threshold }}
