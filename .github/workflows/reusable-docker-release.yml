name: Reusable Docker Release

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image reference without a tag, e.g. ghcr.io/org/service.
        type: string
        required: true
      push:
        description: Push the image and sign it. False builds and scans only.
        type: boolean
        required: false
        default: true
      platforms:
        description: Comma-separated build platforms.
        type: string
        required: false
        default: "linux/amd64"
      build-args:
        description: Newline-separated build arguments.
        type: string
        required: false
        default: ""
      trivy-severity:
        description: Severities that fail the scan.
        type: string
        required: false
        default: "CRITICAL,HIGH"
    secrets:
      REGISTRY_USERNAME:
        description: Registry user, usually github.actor for GHCR.
        required: true
      REGISTRY_PASSWORD:
        description: Registry token with package write access.
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build, scan and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to the registry
        if: ${{ inputs.push }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.image-name }}:${{ github.sha }}
          build-args: ${{ inputs.build-args }}
          provenance: true
          sbom: true

      - name: Scan the image
        if: ${{ inputs.push }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          severity: ${{ inputs.trivy-severity }}
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload scan results
        if: ${{ always() && inputs.push }}
        uses: github/codeql-action/upload-sarif@f6091c0113d1dcf9b98e269ee48e8a7e51b7bdd4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a

      - name: Sign the image
        if: ${{ inputs.push }}
        run: cosign sign --yes "${{ inputs.image-name }}:${{ github.sha }}"
