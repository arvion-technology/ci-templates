name: Reusable Pages Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact uploaded by the caller with actions/upload-pages-artifact.
        type: string
        required: false
        default: "github-pages"
      environment-name:
        description: GitHub environment that owns the deployment URL.
        type: string
        required: false
        default: "github-pages"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: ${{ inputs.artifact-name }}
