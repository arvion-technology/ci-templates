name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        required: false
        default: '["3.11", "3.12"]'
      working-directory:
        description: Directory that contains pyproject.toml.
        type: string
        required: false
        default: "."
      run-lint:
        description: Run ruff before the test matrix.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    if: ${{ inputs.run-lint }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .

  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/requirements*.txt

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing
